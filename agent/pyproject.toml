[project]
name = "ledger-reconciliation-agent"
version = "0.0.1"
description = "Evidence-constrained ledger reconciliation agent."
authors = [
    { name = "32694" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<4.0"
dependencies = [
    "langgraph>=1.0.0",
    "langchain-openai>=1.1.14",
    "langchain>=1.3.10",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "alembic>=1.16,<2",
    "pgvector>=0.4,<1",
    "langgraph-checkpoint-postgres>=3,<4",
    "sentence-transformers>=5,<6",
    "tenacity>=9,<10",
    "pyyaml>=6,<7",
    "langgraph-cli[inmem]>=0.4.10",
]


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "reconciliation_agent",
    "reconciliation_agent.domain",
    "reconciliation_agent.rag",
    "reconciliation_agent.safety",
    "reconciliation_agent.tools",
]
[tool.setuptools.package-dir]
"reconciliation_agent" = "src/reconciliation_agent"
"reconciliation_agent.domain" = "src/reconciliation_agent/domain"
"reconciliation_agent.rag" = "src/reconciliation_agent/rag"
"reconciliation_agent.safety" = "src/reconciliation_agent/safety"
"reconciliation_agent.tools" = "src/reconciliation_agent/tools"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
# CVE-2026-32597: pyjwt < 2.12.0 accepts unknown `crit` header extensions.
# Transitive via langgraph-api -> pyjwt. Remove once langgraph-api requires pyjwt>=2.12.0.
constraint-dependencies = ["pyjwt>=2.12.0"]

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "httpx>=0.28,<1",
    "pytest>=9.0.3",
    "types-pyyaml>=6,<7",
]
